name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  HELM_VERSION: v3.22.0
  HELM_UNITTEST_VERSION: v1.2.1
  KUBECONFORM_VERSION: v0.8.0

jobs:
  go:
    name: Go (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Store tests run against SQLite always and against PostgreSQL when set.
      ABG_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres dbname=postgres sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (audio encoder tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install tools
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION"
          go install "github.com/yannh/kubeconform/cmd/kubeconform@$KUBECONFORM_VERSION"
      - run: helm lint --strict charts/audiobook-generator
      - run: helm unittest charts/audiobook-generator
      - name: kubeconform (every database/TTS mode)
        run: hack/kubeconform.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: audiobook-generator:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nano-image:
    name: Chatterbox Nano image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      # Fails when patch_nano.py no longer matches the server's code.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: images/chatterbox-nano
          push: false
          tags: audiobook-generator-chatterbox-nano:ci
          cache-from: type=gha,scope=nano
          cache-to: type=gha,mode=max,scope=nano

  voice-design-image:
    name: Voice design image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: images/voice-design
          push: false
          tags: audiobook-generator-voice-design:ci
          cache-from: type=gha,scope=voice-design
          cache-to: type=gha,mode=max,scope=voice-design

  e2e:
    name: E2E (kind, ${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: [image, chart]
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/yoadey/audiobook-generator:e2e
          build-args: |
            VERSION=e2e
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: abg
      - run: kind load docker-image ghcr.io/yoadey/audiobook-generator:e2e --name abg
      - run: hack/e2e.sh ${{ matrix.database }}

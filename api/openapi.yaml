openapi: 3.0.3
info:
  title: audiobook-generator API
  description: >-
    HTTP API of the audiobook-generator service. This file is the single source
    of truth: the Go server (internal/api) and the TypeScript client
    (web/src/api) are generated from it.
  version: 0.2.0
servers:
  - url: /api
paths:
  /system:
    get:
      operationId: getSystemInfo
      summary: Version, database and TTS status
      tags: [system]
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"

  /books:
    get:
      operationId: listBooks
      summary: List books
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadBook
      summary: Upload an EPUB and start its import
      tags: [books]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: The book was stored; the import runs in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: getBook
      summary: Get a book
      tags: [books]
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateBook
      summary: Change the narrator voice, speed or lookahead
      tags: [books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: The updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBook
      summary: Delete a book with all its data and files
      tags: [books]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /books/{bookId}/cover:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: getBookCover
      summary: The book's cover image
      tags: [books]
      responses:
        "200":
          description: Cover image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /books/{bookId}/volumes:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: listVolumes
      summary: List a book's volumes
      tags: [chapters]
      responses:
        "200":
          description: Volumes in reading order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volume"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /books/{bookId}/chapters:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: listChapters
      summary: List a book's chapters in reading order
      tags: [chapters]
      parameters:
        - name: volumeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Offset"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
            default: 10000
      responses:
        "200":
          description: A page of chapters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterPage"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /chapters/{chapterId}:
    parameters:
      - $ref: "#/components/parameters/ChapterId"
    get:
      operationId: getChapter
      summary: A chapter with its paragraphs and segments
      tags: [chapters]
      responses:
        "200":
          description: The chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateChapter
      summary: Rename a chapter or exclude it from narration
      tags: [chapters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterUpdate"
      responses:
        "200":
          description: The updated chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /chapters/{chapterId}/merge-next:
    parameters:
      - $ref: "#/components/parameters/ChapterId"
    post:
      operationId: mergeChapterWithNext
      summary: Append the following chapter to this one
      tags: [chapters]
      responses:
        "200":
          description: The merged chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /chapters/{chapterId}/split:
    parameters:
      - $ref: "#/components/parameters/ChapterId"
    post:
      operationId: splitChapter
      summary: Start a new chapter at the given paragraph
      tags: [chapters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterSplit"
      responses:
        "200":
          description: The new chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /jobs:
    get:
      operationId: listJobs
      summary: List background jobs, newest first
      tags: [jobs]
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobStatus"
          style: form
          explode: true
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        default:
          $ref: "#/components/responses/Error"

  /books/{bookId}/render:
    parameters:
      - $ref: "#/components/parameters/BookId"
    post:
      operationId: renderBookChapters
      summary: Queue the next chapters without audio for rendering
      tags: [audio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderRequest"
      responses:
        "202":
          description: Number of chapters queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderResult"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /books/{bookId}/progress:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: getProgress
      summary: The listening position
      tags: [audio]
      responses:
        "200":
          description: The position (chapterId is absent when nothing was played yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: saveProgress
      summary: Store the listening position (keeps the lookahead window rendered)
      tags: [audio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: The stored position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /chapters/{chapterId}/render:
    parameters:
      - $ref: "#/components/parameters/ChapterId"
    post:
      operationId: renderChapter
      summary: Queue a chapter for rendering (again)
      tags: [audio]
      parameters:
        - name: force
          in: query
          required: false
          description: Render even if the audio is current
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: The chapter with its new audio state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /chapters/{chapterId}/audio:
    parameters:
      - $ref: "#/components/parameters/ChapterId"
    get:
      operationId: getChapterAudio
      summary: The chapter's audio (AAC in MP4); supports HTTP range requests
      tags: [audio]
      responses:
        "200":
          description: Audio file
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /voices:
    get:
      operationId: listVoices
      summary: Base voices offered by the TTS server
      tags: [audio]
      responses:
        "200":
          description: Voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voice"
        "502":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /voices/preview:
    post:
      operationId: previewVoice
      summary: Speak a sample text with a voice
      tags: [audio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoicePreview"
      responses:
        "200":
          description: MP3 audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /jobs/{jobId}/retry:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: retryJob
      summary: Queue a failed or canceled job again
      tags: [jobs]
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: cancelJob
      summary: Cancel a queued job
      tags: [jobs]
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 50
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    SystemInfo:
      type: object
      required: [version, commit, database, tts, maxUploadBytes]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
        database:
          $ref: "#/components/schemas/DatabaseInfo"
        tts:
          $ref: "#/components/schemas/TTSInfo"
        maxUploadBytes:
          type: integer
          format: int64
    DatabaseInfo:
      type: object
      required: [dialect, schemaVersion]
      properties:
        dialect:
          type: string
          enum: [sqlite, postgres]
        schemaVersion:
          type: string
          description: ID of the last applied migration
    TTSInfo:
      type: object
      required: [url, reachable]
      properties:
        url:
          type: string
        reachable:
          type: boolean
        voiceCount:
          type: integer
          description: Number of voices the TTS server offers (when reachable)
        error:
          type: string

    BookStatus:
      type: string
      enum: [importing, imported, analyzing, ready, failed]
    Book:
      type: object
      required:
        - id
        - title
        - author
        - language
        - status
        - progress
        - wordCount
        - chapterCount
        - hasCover
        - narratorVoice
        - narratorSpeed
        - lookahead
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        language:
          type: string
        status:
          $ref: "#/components/schemas/BookStatus"
        progress:
          type: number
          description: Progress of the running import (0..1)
        error:
          type: string
          description: Why the import failed
        wordCount:
          type: integer
          format: int64
        chapterCount:
          type: integer
        hasCover:
          type: boolean
        narratorVoice:
          type: string
          description: Kokoro voice or weighted mix, e.g. "af_heart" or "bf_emma(2)+af_bella(1)"
        narratorSpeed:
          type: number
        lookahead:
          type: integer
          description: Chapters after the listening position that are kept rendered
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BookUpdate:
      type: object
      properties:
        narratorVoice:
          type: string
          maxLength: 200
        narratorSpeed:
          type: number
          minimum: 0.5
          maximum: 2
        lookahead:
          type: integer
          minimum: 0
          maximum: 50
    BookPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        total:
          type: integer
          format: int64

    Volume:
      type: object
      required: [id, idx, title, chapterCount, wordCount]
      properties:
        id:
          type: integer
          format: int64
        idx:
          type: integer
        title:
          type: string
        chapterCount:
          type: integer
        wordCount:
          type: integer
          format: int64

    ChapterStatus:
      type: string
      enum: [imported]
    AudioStatus:
      type: string
      enum: [none, queued, rendering, ready, failed]
    Chapter:
      type: object
      required: [id, bookId, idx, title, wordCount, quoteCount, excluded, status, audioStatus, audioStale]
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        volumeId:
          type: integer
          format: int64
        idx:
          type: integer
          description: Position in the book (0-based)
        title:
          type: string
        wordCount:
          type: integer
        quoteCount:
          type: integer
        excluded:
          type: boolean
          description: Front/back matter that is not narrated
        status:
          $ref: "#/components/schemas/ChapterStatus"
        audioStatus:
          $ref: "#/components/schemas/AudioStatus"
        audioDurationMs:
          type: integer
          format: int64
        audioError:
          type: string
        audioStale:
          type: boolean
          description: The audio was rendered with another narrator voice or speed
    ChapterPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        total:
          type: integer
          format: int64
    ParagraphKind:
      type: string
      enum: [text, heading, scene_break]
    SegmentKind:
      type: string
      enum: [narration, quote]
    Segment:
      type: object
      required: [id, idx, kind, quoteRef, text]
      properties:
        id:
          type: integer
          format: int64
        idx:
          type: integer
        kind:
          $ref: "#/components/schemas/SegmentKind"
        quoteRef:
          type: integer
          description: Number of the quotation within the chapter (0 for narration)
        text:
          type: string
    Paragraph:
      type: object
      required: [id, idx, kind, text, segments]
      properties:
        id:
          type: integer
          format: int64
        idx:
          type: integer
        kind:
          $ref: "#/components/schemas/ParagraphKind"
        text:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
    ChapterDetail:
      allOf:
        - $ref: "#/components/schemas/Chapter"
        - type: object
          required: [paragraphs]
          properties:
            prevChapterId:
              type: integer
              format: int64
            nextChapterId:
              type: integer
              format: int64
            paragraphs:
              type: array
              items:
                $ref: "#/components/schemas/Paragraph"
    ChapterUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        excluded:
          type: boolean
    ChapterSplit:
      type: object
      required: [paragraphId, title]
      properties:
        paragraphId:
          type: integer
          format: int64
          description: First paragraph of the new chapter
        title:
          type: string
          minLength: 1
          maxLength: 500

    JobStatus:
      type: string
      enum: [queued, running, done, failed, canceled]
    Job:
      type: object
      required: [id, type, status, attempts, maxAttempts, progress, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        bookId:
          type: integer
          format: int64
        chapterId:
          type: integer
          format: int64
        attempts:
          type: integer
        maxAttempts:
          type: integer
        progress:
          type: number
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    JobPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer
          format: int64

    RenderRequest:
      type: object
      required: [count]
      properties:
        fromChapterId:
          type: integer
          format: int64
          description: First chapter to consider (default the listening position)
        count:
          type: integer
          minimum: 1
          maximum: 500
    RenderResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer

    Progress:
      type: object
      required: [positionMs]
      properties:
        chapterId:
          type: integer
          format: int64
        positionMs:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ProgressUpdate:
      type: object
      required: [chapterId, positionMs]
      properties:
        chapterId:
          type: integer
          format: int64
        positionMs:
          type: integer
          format: int64
          minimum: 0

    Voice:
      type: object
      required: [id, language, gender]
      properties:
        id:
          type: string
        language:
          type: string
          description: e.g. en-US, en-GB
        gender:
          type: string
          enum: [female, male, unknown]
        grade:
          type: string
          description: Overall quality grade from the Kokoro model card (A best)
    VoicePreview:
      type: object
      required: [voice]
      properties:
        voice:
          type: string
          maxLength: 200
        speed:
          type: number
          minimum: 0.5
          maximum: 2
        text:
          type: string
          maxLength: 500

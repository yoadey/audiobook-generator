openapi: 3.0.3
info:
  title: audiobook-generator API
  description: >-
    HTTP API of the audiobook-generator service. This file is the single source
    of truth: the Go server (internal/api) and the TypeScript client
    (web/src/api) are generated from it.
  version: 0.1.0
servers:
  - url: /api
paths:
  /system:
    get:
      operationId: getSystemInfo
      summary: Version, database and TTS status
      tags: [system]
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /books:
    get:
      operationId: listBooks
      summary: List books
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 50
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    SystemInfo:
      type: object
      required: [version, commit, database, tts]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
        database:
          $ref: "#/components/schemas/DatabaseInfo"
        tts:
          $ref: "#/components/schemas/TTSInfo"
    DatabaseInfo:
      type: object
      required: [dialect, schemaVersion]
      properties:
        dialect:
          type: string
          enum: [sqlite, postgres]
        schemaVersion:
          type: string
          description: ID of the last applied migration
    TTSInfo:
      type: object
      required: [url, reachable]
      properties:
        url:
          type: string
        reachable:
          type: boolean
        voiceCount:
          type: integer
          description: Number of voices the TTS server offers (when reachable)
        error:
          type: string
    BookStatus:
      type: string
      enum: [imported, analyzing, ready, failed]
    Book:
      type: object
      required: [id, title, author, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        status:
          $ref: "#/components/schemas/BookStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BookPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        total:
          type: integer
          format: int64

# Stand-in for Kokoro in hack/e2e.sh (the real image is several GB). The
# script lives in hack/fake-tts/server.py and is mounted from a ConfigMap
# that e2e.sh creates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-tts
spec:
  selector:
    matchLabels: { app: fake-tts }
  template:
    metadata:
      labels: { app: fake-tts }
    spec:
      containers:
        - name: fake-tts
          image: python:3.13.16-alpine3.24
          command: [python, /app/server.py]
          env:
            - name: FAKE_LLM_KEY
              value: e2e-llm-key
          ports:
            - containerPort: 8880
          readinessProbe:
            httpGet: { path: /health, port: 8880 }
            periodSeconds: 2
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: fake-tts
---
apiVersion: v1
kind: Service
metadata:
  name: fake-tts
spec:
  selector: { app: fake-tts }
  ports:
    - port: 8880

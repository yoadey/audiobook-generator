# Throwaway PostgreSQL for hack/e2e.sh (no persistence).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17.11
          env:
            - { name: POSTGRES_USER, value: audiobook }
            - { name: POSTGRES_PASSWORD, value: e2e }
            - { name: POSTGRES_DB, value: audiobook }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, audiobook]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432

{{- $feed := and .Values.feed.enabled (not .Values.feed.existingSecret) }}
{{- $oidc := .Values.auth.oidc }}
{{- $session := and $oidc.enabled (not $oidc.sessionKey.existingSecret) }}
{{- if or $feed $session }}
{{- /*
Generated keys survive upgrades: existing values are looked up and kept
(a new feed secret would break every subscribed podcast feed, a new
session key signs everyone out). Tools that render without cluster access
(helm template) cannot look them up; use the existingSecret values there.
*/}}
{{- $name := include "abg.appSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "abg.labels" . | nindent 4 }}
  annotations:
    # Keep the generated keys when the release is uninstalled and reinstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $feed }}
  feed-secret: {{ index $existing "feed-secret" | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  {{- if $session }}
  session-key: {{ index $existing "session-key" | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
{{- end }}

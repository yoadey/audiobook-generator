{{- if and .Values.feed.enabled (not .Values.feed.existingSecret) }}
{{- /*
Generated keys survive upgrades: an existing value is looked up and kept
(a new feed secret would break every subscribed podcast feed). Tools that
render without cluster access (helm template) cannot look it up; give
feed.existingSecret there.
*/}}
{{- $name := include "abg.appSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $feed := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "feed-secret") }}
{{- $feed = index $existing.data "feed-secret" }}
{{- else }}
{{- $feed = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "abg.labels" . | nindent 4 }}
  annotations:
    # Keep the generated keys when the release is uninstalled and reinstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  feed-secret: {{ $feed | quote }}
{{- end }}

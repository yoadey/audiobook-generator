{{- include "abg.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abg.fullname" . }}
  labels:
    {{- include "abg.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  # One replica only: the data volume is ReadWriteOnce and the job runner
  # lives in this process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "abg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $annotations := deepCopy .Values.podAnnotations }}
      {{- if .Values.backup.litestream.enabled }}
      {{- /* The config is mounted with subPath, which never updates in place. */}}
      {{- $_ := set $annotations "checksum/litestream" (include (print $.Template.BasePath "/litestream.yaml") . | sha256sum) }}
      {{- end }}
      {{- if include "abg.ownsPostgresSecret" . }}
      {{- $_ := set $annotations "checksum/secret" (include (print $.Template.BasePath "/secret.yaml") . | sha256sum) }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "abg.metaLabels" . | nindent 8 }}
        {{- include "abg.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "abg.serviceAccountName" . }}
      # No token in every container: only the app's gets one (to scale the
      # voice design server on demand).
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.backup.litestream.enabled }}
      {{- $ls := .Values.backup.litestream }}
      initContainers:
        # A fresh volume gets the database back from the backup before the
        # app starts (nothing happens when the file exists or no backup does).
        - name: litestream-restore
          image: "{{ $ls.image.repository }}:{{ $ls.image.tag }}"
          imagePullPolicy: {{ $ls.image.pullPolicy }}
          args: [restore, -if-db-not-exists, -if-replica-exists, -config, /etc/litestream.yml, /data/audiobook-generator.db]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "abg.litestreamEnv" . | nindent 12 }}
          resources:
            {{- toYaml $ls.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
        # Streams every change of the SQLite database to S3. A native
        # sidecar (Kubernetes 1.29+): it starts before the app and stops
        # after it, so the app's last writes are replicated too.
        - name: litestream
          image: "{{ $ls.image.repository }}:{{ $ls.image.tag }}"
          imagePullPolicy: {{ $ls.image.pullPolicy }}
          restartPolicy: Always
          args: [replicate, -config, /etc/litestream.yml]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "abg.litestreamEnv" . | nindent 12 }}
          resources:
            {{- toYaml $ls.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
      {{- end }}
      containers:
        - name: app
          image: {{ include "abg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ABG_LISTEN_ADDR
              value: ":8080"
            - name: ABG_DATA_DIR
              value: /data
            - name: ABG_MAX_UPLOAD_MB
              value: {{ .Values.maxUploadMB | int | quote }}
            - name: ABG_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: ABG_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- if include "abg.kokoro" . }}
            - name: ABG_TTS_URL
              value: {{ include "abg.ttsUrl" . | quote }}
            {{- else }}
            # No Kokoro: books speak with the other engines.
            - name: ABG_TTS_KOKORO
              value: "false"
            {{- end }}
            - name: ABG_TTS_TIMEOUT
              value: {{ .Values.tts.timeout | quote }}
            - name: ABG_TTS_CONCURRENCY
              value: {{ .Values.tts.concurrency | int | quote }}
            - name: ABG_TTS_DEFAULT_VOICE
              value: {{ .Values.tts.defaultVoice | quote }}
            - name: ABG_TTS_UNLOAD_IDLE
              value: {{ .Values.tts.unloadIdle | quote }}
            {{- with include "abg.ttsEngines" . }}
            - name: ABG_TTS_ENGINES
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.voiceDesign.enabled }}
            {{- $vd := .Values.voiceDesign }}
            - name: ABG_VOICE_DESIGN_URL
              value: {{ printf "http://%s:8000" (include "abg.voiceDesign.fullname" .) | quote }}
            - name: ABG_VOICE_DESIGN_ENGINE
              value: {{ include "abg.voiceDesign.engine" . | quote }}
            {{- if $vd.onDemand }}
            - name: ABG_VOICE_DESIGN_DEPLOYMENT
              value: {{ include "abg.voiceDesign.fullname" . | quote }}
            {{- end }}
            - name: ABG_VOICE_DESIGN_IDLE
              value: {{ $vd.idle | quote }}
            - name: ABG_VOICE_DESIGN_TIMEOUT
              value: {{ $vd.timeout | quote }}
            - name: ABG_VOICE_DESIGN_READY_TIMEOUT
              value: {{ $vd.readyTimeout | quote }}
            {{- end }}
            - name: ABG_AUDIO_BITRATE
              value: {{ .Values.audioBitrate | quote }}
            {{- with .Values.publicUrl }}
            - name: ABG_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.feed.enabled }}
            - name: ABG_FEED_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.feed.existingSecret }}
                  name: {{ .Values.feed.existingSecret }}
                  key: {{ .Values.feed.existingSecretKey }}
                  {{- else }}
                  name: {{ include "abg.appSecretName" . }}
                  key: feed-secret
                  {{- end }}
            {{- end }}
            {{- include "abg.oidcEnv" . | nindent 12 }}
            {{- include "abg.databaseEnv" . | nindent 12 }}
            {{- include "abg.llmEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The server listens only after migrations ran; allow up to 10 min.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Independent of running jobs, so long renders never cause a restart.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if eq (include "abg.voiceDesign.onDemand" .) "true" }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq (include "abg.voiceDesign.onDemand" .) "true" }}
        # As Kubernetes mounts it, but for the app container only.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        {{- if .Values.backup.litestream.enabled }}
        - name: litestream
          configMap:
            name: {{ include "abg.fullname" . }}-litestream
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "abg.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

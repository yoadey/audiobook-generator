# Default values for audiobook-generator.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/yoadey/audiobook-generator
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Size limit of the /tmp emptyDir (render scratch space).
tmpSizeLimit: 4Gi

# Largest accepted EPUB upload in MiB. Reverse proxies have their own limit
# (ingress-nginx: nginx.ingress.kubernetes.io/proxy-body-size; Traefik has
# none by default).
maxUploadMB: 512

log:
  level: info # debug | info | warn | error
  format: json # json | text

# Additional environment variables for the app container.
extraEnv: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: audiobooks.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: audiobooks-tls
  #    hosts:
  #      - audiobooks.example.com

# Data volume: uploaded EPUBs, rendered audio and, in SQLite mode, the
# database file. A single huge book needs ~10-20 GB of audio.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 50Gi
  annotations: {}

database:
  # sqlite: self-contained, the database file lives on the data volume.
  # postgres: see database.postgres.mode.
  type: sqlite
  postgres:
    # external: connect to an existing server (host/user/password below).
    # cnpg: render a CloudNativePG Cluster (needs the CNPG operator).
    mode: external
    host: ""
    port: 5432
    database: audiobook
    user: audiobook
    # Plain-text password, only used when existingSecret is empty.
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password
    sslMode: prefer
    cnpg:
      instances: 1
      # Empty: the operator's default PostgreSQL image.
      imageName: ""
      storage:
        size: 5Gi
        storageClass: ""
      resources: {}

# AAC bitrate of the rendered chapter files (mono speech: 48k-64k is plenty).
audioBitrate: 64k

tts:
  # Used when tts.kokoro.enabled is false, e.g. http://kokoro.tts:8880
  externalUrl: ""
  # Timeout for a single synthesis request.
  timeout: 5m
  # Parallel synthesis requests while rendering a chapter; about
  # 1-2 per Kokoro replica.
  concurrency: 2
  # Narrator of books without an own voice (see the voice list in the UI).
  defaultVoice: af_heart
  kokoro:
    enabled: true
    image:
      repository: ghcr.io/remsky/kokoro-fastapi-cpu
      tag: v0.9.0
      pullPolicy: IfNotPresent
    replicas: 1
    podAnnotations: {}
    priorityClassName: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # The image runs as "appuser" (uid 1000) and writes temp files below
    # /app, so the root filesystem stays writable.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    # Extra environment for Kokoro-FastAPI (see its api/src/core/config.py).
    extraEnv: []
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 4Gi

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

networkPolicy:
  # Restricts the Kokoro pods to traffic from the app pods.
  enabled: false

# Default values for audiobook-generator.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/yoadey/audiobook-generator
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Size limit of the /tmp emptyDir (render scratch space).
tmpSizeLimit: 4Gi

# Largest accepted EPUB upload in MiB. Reverse proxies have their own limit
# (ingress-nginx: nginx.ingress.kubernetes.io/proxy-body-size; Traefik has
# none by default).
maxUploadMB: 512

log:
  level: info # debug | info | warn | error
  format: json # json | text

# Additional environment variables for the app container.
extraEnv: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: audiobooks.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: audiobooks-tls
  #    hosts:
  #      - audiobooks.example.com

# External URL of the service (https://audiobooks.example.com), used in
# podcast feeds. Empty: taken from each request; behind a TLS-terminating
# proxy that needs X-Forwarded-Proto: https.
publicUrl: ""

# Podcast RSS feed per book. Feed URLs carry a token instead of needing a
# login, so podcast apps can subscribe; anyone with the URL can listen.
feed:
  enabled: true
  # Secret holding the token key (at least 16 characters). Empty: the chart
  # generates one and keeps it across upgrades. Changing the key
  # invalidates every feed URL.
  existingSecret: ""
  existingSecretKey: feed-secret

# Sign-in with OpenID Connect (e.g. Zitadel). Register a web application
# with the redirect URI <publicUrl>/auth/callback (and, for sign-out,
# the post-logout URI <publicUrl>/); PKCE is always used, so a public
# client without secret works too. Probes, /metrics and the podcast feeds
# stay reachable without a sign-in.
auth:
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    # Existing Secret with the client secret (empty: public client).
    clientSecret:
      existingSecret: ""
      key: client-secret
      # Also read the client ID from this Secret (when clientId is empty),
      # e.g. one that Terraform writes for the identity provider's app.
      clientIdKey: ""
    scopes: openid profile email
    # How long a sign-in lasts without use.
    sessionTTL: 720h
    # Key encrypting the session cookie (at least 32 characters). Empty
    # existingSecret: the chart generates one and keeps it across upgrades.
    sessionKey:
      existingSecret: ""
      key: session-key

# Data volume: uploaded EPUBs, rendered audio and, in SQLite mode, the
# database file. A single huge book needs ~10-20 GB of audio.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 50Gi
  annotations: {}

database:
  # sqlite: self-contained, the database file lives on the data volume.
  # postgres: see database.postgres.mode.
  type: sqlite
  postgres:
    # external: connect to an existing server (host/user/password below).
    # cnpg: render a CloudNativePG Cluster (needs the CNPG operator).
    mode: external
    host: ""
    port: 5432
    database: audiobook
    user: audiobook
    # Plain-text password, only used when existingSecret is empty.
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password
    sslMode: prefer
    cnpg:
      instances: 1
      # Empty: the operator's default PostgreSQL image.
      imageName: ""
      storage:
        size: 5Gi
        storageClass: ""
      resources: {}

backup:
  # Continuous backup of the SQLite database to S3 (e.g. Garage, MinIO)
  # with Litestream: a sidecar streams every change; on a fresh volume an
  # init container restores the latest state before the app starts. Audio
  # files are not backed up: after a restore the app notices they are gone
  # and renders them again. Needs Kubernetes 1.29+. PostgreSQL is
  # backed up with its own tools (e.g. CNPG's barman).
  litestream:
    enabled: false
    image:
      repository: litestream/litestream
      tag: 0.3.13
      pullPolicy: IfNotPresent
    s3:
      # Empty for AWS S3; e.g. http://garage.garage.svc:3900
      endpoint: ""
      # The region the S3 server signs with (Garage: "garage" by default).
      region: us-east-1
      bucket: ""
      path: audiobook-generator
      forcePathStyle: true
      # Secret with the S3 credentials.
      existingSecret: ""
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
    syncInterval: 10s
    # How long snapshots and WAL are kept.
    retention: 168h
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# AAC bitrate of the rendered chapter files (mono speech: 48k-64k is plenty).
audioBitrate: 64k

tts:
  # Kokoro elsewhere, used when tts.kokoro.enabled is false, e.g.
  # http://kokoro.tts:8880. With neither, the app speaks with the other
  # engines only (tts.chatterbox, tts.engines).
  externalUrl: ""
  # Timeout for a single synthesis request.
  timeout: 5m
  # Parallel synthesis requests while rendering a chapter; about
  # 1-2 per Kokoro replica.
  concurrency: 2
  # Narrator of books without an own voice (see the voice list in the UI);
  # its engine is the default one ("chatterbox:Emily.wav" for Chatterbox).
  # Without Kokoro, a Kokoro voice here stands for the first engine's
  # default voice.
  defaultVoice: af_heart
  # How long Chatterbox speaks nothing before the app unloads its model
  # (frees ~1.7 GiB for Nano on CPU; loading it again takes ~10 s before
  # the next synthesis). Can be turned off in the UI (Settings); "0s":
  # never.
  unloadIdle: 10m
  kokoro:
    enabled: true
    image:
      repository: ghcr.io/remsky/kokoro-fastapi-cpu
      tag: v0.9.0
      pullPolicy: IfNotPresent
    replicas: 1
    # Recreate: an update stops the old pod before the new one starts, so a
    # cluster without room for a second Kokoro (it asks for whole CPUs) does
    # not deadlock the rollout. Kokoro is unavailable for a moment meanwhile.
    strategy:
      type: Recreate
    podAnnotations: {}
    priorityClassName: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # The image runs as "appuser" (uid 1000) and writes temp files below
    # /app, so the root filesystem stays writable.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    # Extra environment for Kokoro-FastAPI (see its api/src/core/config.py).
    extraEnv: []
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 4Gi

  # Speech engines besides Kokoro, e.g. a stronger one for the main
  # characters (docs/tts-engines.md). Their voices are written
  # "<name>:<voice>" and chosen per character. Fields: name, kind
  # (openai | chatterbox), url, and optionally model, variant, concurrency,
  # timeout, gain, speed, voices. Gemini is set up below (tts.gemini).
  engines: []
  # - name: orpheus
  #   kind: openai
  #   url: http://orpheus.tts:5005
  # The Gemini API's speech generation (Google AI Studio): 30 prebuilt
  # voices in the cloud, no GPU needed, but a daily quota. Every piece of a
  # chapter and every preview is a request; once the quota is used up,
  # chapters wait for the next day. The usage is shown with the engine
  # (Voices, System, the book's narrator). The book text leaves the cluster,
  # and on the free tier Google may use it to improve its products. When on,
  # it joins tts.engines (docs/tts-engines.md).
  gemini:
    enabled: false
    # Engine name, the prefix of its voices ("gemini:Kore").
    name: gemini
    # The existing Secret with the API key (the one of an LLM provider on
    # the same Google project works too), e.g.
    # { name: audiobook-llm-keys, key: gemini }.
    apiKeySecret: {}
    model: gemini-3.1-flash-tts-preview
    # Voice that narrates when a book switches to this engine.
    defaultVoice: Kore
    # Ask for the emotion of quotes and for thoughts ("Say angrily: ...")
    # instead of giving them by loudness.
    emotions: false
    # The model's quota as AI Studio shows it (Usage > Rate limits); 0 is
    # unknown. Requests wait for the per-minute window, and the daily
    # limits tell what is left today. An unknown limit is taken from the
    # engine's answer once it is hit.
    limits:
      rpm: 0
      tpm: 0
      rpd: 0
      tpd: 0
    # Google's daily quotas reset at midnight Pacific time.
    quotaTimezone: America/Los_Angeles
    concurrency: 1
    timeout: 5m
    # Evens out its loudness against Kokoro's.
    gain: 1
    # Longest text sent at once: the pieces in one voice are joined up to
    # it (fewer, longer requests save quota). Both can be changed in the UI
    # (Settings, Speech requests).
    maxChars: 4000
    # Read consecutive paragraphs in one voice in one request, not only
    # those the chapter preparation found to flow on.
    joinParagraphs: true
  # Chatterbox-TTS-Server (devnen), which speaks emotions itself. Off by
  # default: it needs a GPU for book-length work (on CPU it is roughly ten
  # times slower than Kokoro). When on, it joins tts.engines.
  chatterbox:
    enabled: false
    # Engine name, the prefix of its voices ("chatterbox:Emily.wav").
    name: chatterbox
    # Voice that narrates when a book switches to this engine (empty:
    # Emily.wav).
    defaultVoice: ""
    # original (0.5B) acts emotions (exaggeration); turbo (350M) is faster
    # but ignores them; nano (110M) is the fastest, about real time on 4 CPU
    # cores, and ignores them too (it runs nanoImage).
    variant: original
    # Parallel requests: the server synthesizes one at a time, keep 1.
    concurrency: 1
    timeout: 10m
    # Evens out its loudness against Kokoro's.
    gain: 1
    # Longest text sent at once: the pieces of a paragraph in one voice
    # are joined up to it (the server splits longer text by sentences).
    maxChars: 1000
    image:
      repository: ghcr.io/devnen/chatterbox-tts-server
      # -cpu, -nvidia (CUDA 12.1), -cu128, -cu130 or -rocm.
      tag: sha-915ae28-cpu
      pullPolicy: IfNotPresent
    # The image for variant nano: devnen's CPU image above with Nano patched
    # in (images/chatterbox-nano), released with the app. Defaults to the
    # chart's appVersion.
    nanoImage:
      repository: ghcr.io/yoadey/audiobook-generator-chatterbox-nano
      tag: ""
      pullPolicy: IfNotPresent
    # Model weights (downloaded from Hugging Face on first start) and the
    # reference clips voices are cloned from (reference_audio/).
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes: [ReadWriteOnce]
      size: 20Gi
    # Optional Hugging Face token (a Secret with key HF_TOKEN).
    hfTokenSecret: ""
    podAnnotations: {}
    priorityClassName: ""
    # E.g. runtimeClassName: nvidia for the NVIDIA container runtime.
    runtimeClassName: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # The image runs as root and writes below /app.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
    extraEnv: []
    # For a GPU add e.g. limits: {nvidia.com/gpu: 1}.
    resources:
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        memory: 12Gi

# Voice design: a character's voice made from a description ("an elderly
# man, deep and gruff, speaks slowly") with Qwen3-TTS VoiceDesign on CPU;
# the clip is uploaded to Chatterbox, which clones it. Slow (minutes per
# voice) and memory-hungry, so the pod runs only while voices are designed
# (onDemand: the app scales its Deployment up and, once idle, down).
voiceDesign:
  enabled: false
  # Engine that clones the clips (empty: tts.chatterbox.name); a Chatterbox
  # engine.
  engine: ""
  # Run the pod only while designing: the app scales it up for a design
  # and to zero when idle (a Role lets the app's own ServiceAccount scale
  # exactly this Deployment). The chart sets no replica count then, so
  # upgrades never reset it.
  onDemand: true
  # How long the pod keeps running after the last design.
  idle: 10m
  # One design (CPU: one to a few minutes, more on slow nodes).
  timeout: 30m
  # How long a design waits for the pod to start (the first start
  # downloads the model, ~4 GB).
  readyTimeout: 30m
  image:
    repository: ghcr.io/yoadey/audiobook-generator-voice-design
    # Defaults to the chart's appVersion (released with the app).
    tag: ""
    pullPolicy: IfNotPresent
  model: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
  # A commit of the model repository to pin (empty: its main branch).
  modelRevision: ""
  # float32, or bfloat16 (half the memory; slower on CPUs without AMX).
  dtype: float32
  # Torch threads (0: all cores of the node).
  threads: 0
  # Model cache (Hugging Face).
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 15Gi
  # Optional Hugging Face token (a Secret with key HF_TOKEN).
  hfTokenSecret: ""
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  extraEnv: []
  resources:
    requests:
      cpu: "2"
      memory: 10Gi
    limits:
      memory: 16Gi

casting:
  # How many speaking characters (the most important ones) get a voice
  # recipe of their own; everyone else speaks with a pool voice by gender
  # and age.
  mainCharacters: 50

llm:
  # How long a request waits for a provider's per-minute window before it
  # falls back to the next provider.
  maxWait: 70s
  # Input tokens per character analysis request. Larger batches need fewer
  # requests (daily request quotas) but a provider with a large enough
  # tokens-per-minute limit and context; batches that are too large for
  # every provider are split automatically.
  analysisBatchTokens: 30000
  # Input tokens per speaker attribution request; longer chapters are sent
  # in parts.
  attributionTokens: 12000
  # OpenAI-compatible providers for character analysis and speaker
  # attribution, tried in this order. More can be added in the UI (Settings);
  # providers listed here appear there read-only. Book text is sent to them:
  # free tiers may use it for training.
  providers: []
  # - name: gemini
  #   baseUrl: https://generativelanguage.googleapis.com/v1beta/openai/
  #   model: gemini-2.5-flash           # see "Load models" in the UI
  #   apiKeySecret:                      # an existing Secret
  #     name: audiobook-llm-keys
  #     key: gemini
  #   # Limits of your plan (0 or unset: none). Daily limits reset at
  #   # midnight in quotaTimezone (Gemini: Pacific time).
  #   limits: { rpm: 10, tpm: 250000, rpd: 250, tpd: 0 }
  #   quotaTimezone: America/Los_Angeles
  #   # json_schema | json_object | prompt (when the provider rejects schemas)
  #   structuredOutput: json_schema
  #   maxOutputTokens: 0                 # 0: server default
  #   timeoutSeconds: 300
  #   extraParams: { reasoning_effort: low }   # merged into every request
  #   enabled: true

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

networkPolicy:
  # Restricts the Kokoro pods to traffic from the app pods.
  enabled: false

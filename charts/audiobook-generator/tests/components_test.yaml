suite: optional components
release:
  name: abg
tests:
  - it: renders Kokoro by default with a pinned image
    template: templates/kokoro.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - documentIndex: 0
        equal:
          path: spec.strategy.type
          value: Recreate
      - documentIndex: 1
        equal:
          path: spec.ports[0].port
          value: 8880

  - it: omits Kokoro when an external TTS is used
    template: templates/kokoro.yaml
    set:
      tts.kokoro.enabled: false
      tts.externalUrl: http://tts.example:8880
    asserts:
      - hasDocuments:
          count: 0

  - it: speaks with Chatterbox only when Kokoro is off
    template: templates/deployment.yaml
    set:
      tts.kokoro.enabled: false
      tts.chatterbox.enabled: true
      tts.chatterbox.defaultVoice: Adrian.wav
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ABG_TTS_KOKORO
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ABG_TTS_URL
            value: http://abg-audiobook-generator-kokoro:8880
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "ABG_TTS_ENGINES")].value
          pattern: '"defaultVoice":"Adrian.wav"'

  - it: needs a default voice without Kokoro
    template: templates/deployment.yaml
    set:
      tts.kokoro.enabled: false
      tts.engines:
        - name: orpheus
          kind: openai
          url: http://orpheus:5005
    asserts:
      - failedTemplate:
          errorMessage: "without Kokoro, an engine needs a defaultVoice (or voices) to narrate new books"

  - it: names the speech engines in the notes
    template: templates/NOTES.txt
    set:
      tts.kokoro.enabled: false
      tts.chatterbox.enabled: true
      tts.chatterbox.variant: nano
    asserts:
      - matchRegexRaw:
          pattern: "TTS:      no Kokoro, Chatterbox \\(nano\\)"

  - it: omits Chatterbox by default
    template: templates/chatterbox.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Chatterbox with a pinned image, its config and storage
    template: templates/chatterbox.yaml
    set:
      tts.chatterbox.enabled: true
      tts.chatterbox.variant: turbo
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        matchRegex:
          path: data["config.yaml"]
          pattern: "repo_id: chatterbox-turbo"
      - documentIndex: 1
        isKind:
          of: PersistentVolumeClaim
      - documentIndex: 2
        equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/devnen/chatterbox-tts-server:sha-915ae28-cpu
      - documentIndex: 2
        equal:
          path: spec.strategy.type
          value: Recreate
      - documentIndex: 3
        equal:
          path: spec.ports[0].port
          value: 8004

  - it: runs Nano from the patched image of the release
    template: templates/chatterbox.yaml
    chart:
      appVersion: 9.9.9
    set:
      tts.chatterbox.enabled: true
      tts.chatterbox.variant: nano
    asserts:
      - documentIndex: 0
        matchRegex:
          path: data["config.yaml"]
          pattern: "repo_id: chatterbox-nano"
      - documentIndex: 2
        equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/yoadey/audiobook-generator-chatterbox-nano:9.9.9
      - documentIndex: 2
        equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/yoadey/audiobook-generator-chatterbox-nano:9.9.9

  - it: rejects an unknown Chatterbox variant
    template: templates/chatterbox.yaml
    set:
      tts.chatterbox.enabled: true
      tts.chatterbox.variant: flash
    asserts:
      - failedTemplate: {}

  - it: rejects an engine named like the chart's Chatterbox
    template: templates/deployment.yaml
    set:
      tts.chatterbox.enabled: true
      tts.engines:
        - name: chatterbox
          kind: openai
          url: http://x
    asserts:
      - failedTemplate: {}

  - it: passes engines and the chart's Chatterbox to the app
    template: templates/deployment.yaml
    set:
      tts.chatterbox.enabled: true
      tts.engines:
        - name: orpheus
          kind: openai
          url: http://orpheus:5005
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ABG_TTS_ENGINES
            value: '[{"kind":"openai","name":"orpheus","url":"http://orpheus:5005"},{"concurrency":1,"gain":1,"kind":"chatterbox","name":"chatterbox","timeout":"10m","url":"http://abg-audiobook-generator-chatterbox:8004","variant":"original"}]'

  - it: renders a CNPG cluster only in cnpg mode
    template: templates/cnpg-cluster.yaml
    set:
      database.type: postgres
      database.postgres.mode: cnpg
      database.postgres.cnpg.storage.storageClass: fast
    asserts:
      - isKind:
          of: Cluster
      - equal:
          path: metadata.name
          value: abg-audiobook-generator-db
      - equal:
          path: spec.bootstrap.initdb
          value:
            database: audiobook
            owner: audiobook
      - equal:
          path: spec.storage.storageClass
          value: fast

  - it: renders no CNPG cluster with SQLite
    template: templates/cnpg-cluster.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the data PVC on uninstall
    template: templates/pvc.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi

  - it: skips the PVC for an existing claim
    template: templates/pvc.yaml
    set:
      persistence.existingClaim: my-claim
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ingress
    template: templates/ingress.yaml
    set:
      ingress:
        enabled: true
        className: traefik
        hosts:
          - host: books.example
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik
      - equal:
          path: spec.rules[0].host
          value: books.example
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: abg-audiobook-generator

  - it: renders the ServiceMonitor when enabled
    template: templates/servicemonitor.yaml
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].path
          value: /metrics

  - it: restricts Kokoro to the app pods
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: app
